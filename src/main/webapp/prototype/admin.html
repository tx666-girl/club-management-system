<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员原型 - 社团管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html">
      <span class="brand-mark" aria-hidden="true">社</span>
      <span>社团管理系统</span>
    </a>
    <nav class="nav">
      <a class="nav-link" href="home.html">首页</a>
      <a class="nav-link active" href="admin.html">管理员原型</a>
      <a class="nav-link" href="personal-admin.html">个人中心</a>
    </nav>
    <div class="user-menu">
      <span class="avatar">张</span>
      <span>张三</span>
      <span class="role-pill">管理员</span>
    </div>
  </header>

  <main class="page">
    <div class="page-heading">
      <div>
        <h1>管理员界面原型</h1>
        <p>集中查看管理员需要使用的三个核心界面。</p>
      </div>
      <span class="tag">管理员视角</span>
    </div>

    <section class="entry-grid">
      <article class="entry-card">
        <span class="brand-mark" aria-hidden="true">审</span>
        <h2>申请审批</h2>
        <p>查看普通用户的入团申请，执行通过或驳回操作。</p>
        <a class="button button-primary" href="applications.html">打开申请审批</a>
      </article>

      <article class="entry-card">
        <span class="brand-mark" aria-hidden="true">社</span>
        <h2>社团管理</h2>
        <p>进入社团详情，发布活动、查看公告并管理成员。</p>
        <a class="button button-primary" href="club-admin.html">打开社团管理</a>
      </article>

      <article class="entry-card">
        <span class="brand-mark" aria-hidden="true">我</span>
        <h2>管理员个人中心</h2>
        <p>查看管理的社团、管理活动和待审批事项。</p>
        <a class="button button-primary" href="personal-admin.html">打开个人中心</a>
      </article>
    </section>
  </main>
