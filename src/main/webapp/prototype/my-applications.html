<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的申请 - 社团管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html">
      <span class="brand-mark" aria-hidden="true">社</span>
      <span>社团管理系统</span>
    </a>
    <nav class="nav">
      <a class="nav-link" href="home.html">首页</a>
      <a class="nav-link active" href="my-applications.html">我的申请</a>
      <a class="nav-link" href="personal-member.html">个人中心</a>
    </nav>
    <div class="user-menu">
      <span class="avatar">张</span>
      <span>张三</span>
      <span class="role-pill">普通成员</span>
    </div>
  </header>

  <main class="page">
    <div class="page-heading">
      <div>
        <h1>我的申请</h1>
        <p>查看入团申请的处理进度和已加入的社团。</p>
      </div>
      <a class="button button-primary" href="home.html">继续浏览社团</a>
    </div>

    <p id="myApplicationsMessage" class="message" role="alert"></p>

    <section class="profile-summary">
      <div class="profile-main">
        <span class="avatar">张</span>
        <div>
          <h2 id="profileName">张三</h2>
          <p id="profileMeta">ID:123456 · 2024 级 · 普通成员</p>
        </div>
      </div>
      <div class="profile-actions">
        <span id="joinedCount" class="tag">已加入 0 个社团</span>
        <span id="pendingCount" class="tag amber">0 条申请中</span>
      </div>
    </section>

    <section class="panel" style="margin-top: 18px;">
      <div class="panel-head">
        <div>
          <h2>申请记录</h2>
          <p>管理员审批后会更新申请状态。</p>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>社团</th>
              <th>申请类型</th>
              <th>申请时间</th>
              <th>状态</th>
              <th>处理时间</th>
            </tr>
          </thead>
          <tbody id="myApplicationTable">
            <tr>
              <td>计算机协会</td>
              <td>入团申请</td>
              <td>2026-10-18 10:20</td>
              <td><span class="status approved">已通过</span></td>
              <td>2026-10-18 14:05</td>
            </tr>
            <tr>
              <td>摄影社</td>
              <td>入团申请</td>
              <td>2026-10-19 09:12</td>
              <td><span class="status pending">待审批</span></td>
              <td class="muted">尚未处理</td>
            </tr>
            <tr>
              <td>青年志愿者协会</td>
              <td>入团申请</td>
              <td>2026-10-15 16:30</td>
              <td><span class="status rejected">已驳回</span></td>
              <td>2026-10-16 10:00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/my-applications.js"></script>
</body>
</html>
